#Shake the camera during earthquakes and near tornadoes.
cameraShake = true
#Camera shake strength multiplier.
# Default: 1.0
# Range: 0.0 ~ 3.0
shakeStrength = 0.65
#Render wall clouds and storm bases in the sky.
stormClouds = false
#Replace the flat vanilla clouds with the mod's volumetric clouds (white in fair weather, grey in rain, dark in storms).
replaceVanillaClouds = false
#Multiplier for tornado and sandstorm particle density.
# Default: 1.0
# Range: 0.0 ~ 3.0
particleDensity = 1.0
#Fair-weather cloud coverage (0 = clear sky, 1 = overcast).
# Default: 0.35
# Range: 0.0 ~ 1.0
cloudCover = 0.35
#How far (blocks) fair-weather clouds are drawn around the camera.
# Default: 640
# Range: 128 ~ 2048
cloudRange = 640
#Shader pack (Iris) compatibility. AUTO detects an active Iris shader pack and switches to rendering
#paths that shader packs light and shadow correctly. ON forces it, OFF disables it.
#Allowed Values: AUTO, ON, OFF
shaderCompatibility = "AUTO"
#Last graphics preset picked in the settings screen (CUSTOM once an option is changed by hand).
#Allowed Values: LOW, MEDIUM, HIGH, ULTRA, CUSTOM
graphicsPreset = "CUSTOM"
#Tornado funnel mesh detail: 1 = low, 2 = medium, 3 = high.
# Default: 3
# Range: 1 ~ 3
funnelDetail = 3
#Debris particles with the texture of the ground torn up by tornadoes.
blockDebris = true
#Ground effects around tornadoes: kicked-up dirt and inflow dust.
groundParticles = true
#Density of the billowing dust cloud at the base of tornadoes.
# Default: 1.0
# Range: 0.0 ~ 2.0
dustCloudDensity = 1.0
#Automatically lower particles and effects when the frame rate drops (recommended on weaker PCs).
adaptivePerformance = true
